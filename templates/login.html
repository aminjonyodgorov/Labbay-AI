{% extends "base.html" %}
{% block title %}Kirish — Labbay-AI{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 w-full max-w-md shadow-2xl">
    <h1 class="text-2xl font-bold mb-2 text-center">🎙️ Labbay-AI Admin</h1>
    <p class="text-slate-400 text-center text-sm mb-6">Boshqaruv paneliga kirish</p>
    {% if error %}
    <div class="bg-red-900/40 border border-red-700 text-red-200 rounded-lg px-4 py-2 mb-4 text-sm">
      {{ error }}
    </div>
    {% endif %}
    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-300 mb-1">Parol</label>
        <input type="password" name="password" required autofocus
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:border-purple-500 focus:outline-none">
      </div>
      <button type="submit"
        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg py-2 transition">
        Kirish
      </button>
    </form>
  </div>
</div>
{% endblock %}
